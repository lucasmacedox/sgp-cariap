[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgpcariap"
dynamic = ["version"]
description = "Aplica os serviços do Cariap nos contratos do SGP pela interface web."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10", "coverage>=7"]

[project.scripts]
sgp-cariap = "sgpcariap.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "sgpcariap.__version__" }

[tool.setuptools.packages.find]
include = ["sgpcariap*"]

[tool.setuptools.package-data]
sgpcariap = ["static/*", "static/**/*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "BLE"]
ignore = ["SIM105", "SIM108", "B905"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
